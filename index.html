<!DOCTYPE html>
<head>
<title>The scrambler</title>
<link rel="stylesheet" href="main.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header>
  <div class="Intro">
  <h1 >A overly simplified dictionary</h1>
  <h2>As well as an Scramble Assistant</h2>
  <p>Cookies are currently being used to store words in history tab</p>
  </div>
</header>
<!--Card -->
 <div class="DictWrap">
  <form class="DictAPI">
    <input type="text" class="WordInput" placeholder="Enter a word">
    <button type="submit">Search</button>
  </form>

  <div class="Card" style="display:none">

  </div>

  <!--History toggle -->
    <div class="HistoryPanel">
    <button type="button" class="HistoryToggle" aria-expanded="false">History</button>
    <div class="HistoryList" hidden></div>
  </div>

<!--Multiplier GUI -->
  <div class="MultiplierGUI" style="display:none">
    <div class="MultiplierSection"> 
     <!--letter mult -->
      <h3> Letter Multiplier </h3>
      <div class="MultiplierOptions">
        <label>
           <input type="radio" name="letterMultiplier" value="blank" checked> Blank (0x)
        </label>
        <label>
          <input type="radio" name="letterMultiplier" value="2"> Double (2x)
        </label>
        <label>
          <input type="radio" name="letterMultiplier" value="3"> Triple (3x)
        </label>
     </div>
     <p class="Guide"> Select a multiplier, then select a letter to apply.</p>
   </div>

   <!--Word mult -->
   <div class="MultiplierSection">
     <h3> Word Multiplier </h3>
     <div class="MultiplierOptions">
       <label>
         <input type="radio" name="wordMultiplier" value="none" checked> None (1x)
       </label>
       <label>
         <input type="radio" name="wordMultiplier" value="2"> Double (2x)
       </label>
       <label>
         <input type="radio" name="wordMultiplier" value="3"> Triple (3x)
       </label>
    </div>
    </div>
    <button type="button" class="ResetMultipliers">Reset Multipliers</button>

  </div>
</body>

 <script src="RAAAH.js"></script>
