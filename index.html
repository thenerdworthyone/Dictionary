<!DOCTYPE html>
<head>
<title>The scrambler</title>
<link rel="stylesheet" href="main.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header>
  <div class="Intro">
  <h1 >A overly simplified dictionary</h1>
  <h2>As well as an Scramble Assistant</h2>
  </div>
</header>
<!--Card -->
 <div class="DictWrap">
  <form class="DictAPI">
    <input type="text" class="WordInput" placeholder="Enter a word">
    <button type="submit">Search</button>
  </form>

  <div class="Card" style="display:none">

  </div>
<!--Multiplier GUI -->
  <div class="multiplierGUI" style="display:none">
    <div class="multiplierSection"> 
      <h3> Letter multiplier </h3>
      <div class="multiplierOptions">
        <label>
          <input type="radio" name="letterMultiplier" value="none" checked> None
        </label>
        <label>
          <input type="radio" name="letterMultiplier" value="2"> Double (2x)
        </label>
        <label>
          <input type="radio" name="letterMultiplier" value="3"> Triple (3x)
        </label>
     </div>
     <p class="Guide"> Select a multiplier, then select a letter to apply.</p>
   </div>

   <div class="multiplierSection">
     <h3> Word multiplier </h3>
     <div class="multiplierOptions">
       <label>
         <input type="radio" name="wordMultiplier" value="none" checked> None
       </label>
       <label>
         <input type="radio" name="wordMultiplier" value="2"> Double (2x)
       </label>
       <label>
         <input type="radio" name="wordMultiplier" value="3"> Triple (3x)
       </label>
    </div>

  </div>
</body>

 <script src="RAAAH.js"></script>
