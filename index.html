<!DOCTYPE html>
<head>
<title>The scrambler</title>
<link rel="stylesheet" href="main.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<header>
  <div class="Intro">
  <h1 >A overly simplified dictionary</h1>
  <h2>As well as an Scramble Assistant</h2>
  </div>
</header>

 <div class="DictWrap">
  <form class="DictAPI">
    <input type="text" class="WordInput" placeholder="Enter a word">
    <button type="submit">Search</button>
  </form>

  <div class="Card">
   <h1 class="WordDisplay"> placeholder</h1>
   <p class= "PhoneticDisplay"> Cuh PLuh</p>
   <p class="AudioDisplay">mp4.exe</p>
   <p class="DefinitionDisplay">This word means: blah blah blah</p>
   <p class= "ErrorDisplay">Word doesnt exist in the database of the Api</p>
   <p class="LetterValue">Value: blah blah blah</p>
  </div>
</body>

 <script src="RAAAH.js"></script>
