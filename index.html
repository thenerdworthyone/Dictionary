<!DOCTYPE html>
<head>
<title>The scrambler</title>
<link rel="stylesheet" href="main.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<header>
  <div class="Intro">
  <h1 >A overly simplified dictionary</h1>
  <h2>As well as an Scramble Assistant</h2>
  </div>
</header>

 <div class="DictWrap">
  <form class="DictAPI">
    <input type="text" class="WordInput" placeholder="Enter a word">
    <button type="submit">Search</button>
  </form>

  <div class="Card">
   <h1 class="WordDisplay"> placeholder</h1>

   <p class="Section">Phonetic Spelling:</p>
   <p class= "PhoneticDisplay"> Cuh PLuh</p>

   <p class="Section">Audio:</p>
   <audio class="AudioDisplay" controls></audio>

   <p class="Section">Defintion(s):</p>
   <ul class="DefinitionDisplay">
     <li>This word means: blah blah blah</li>
   </ul>

   <p class="Section">Letter Value:</p>
   <p class="LetterValue">blah blah blah</p>

   <p class= "ErrorDisplay">Word doesnt exist in the database of the Api</p>
   
  </div>
  </div>
</body>

 <script src="RAAAH.js"></script>
